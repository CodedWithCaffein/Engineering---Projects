<svg xmlns="http://www.w3.org/2000/svg" width="900" height="424" viewBox="0 0 900 424"><rect width="100%" height="100%" fill="#f7f7f7"/><text x="24" y="33" font-family="Arial,sans-serif" font-size="20" fill="#111">Gear ratio, torque and speed</text><text x="24" y="58" font-family="Arial,sans-serif" font-size="13" fill="#555">Current source excerpt · rendered October 31, 2026 · not a development screenshot</text><text x="22" y="96" font-family="Consolas,monospace" font-size="15" fill="#777">55</text><text x="78" y="96" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve">function calculateTrain(sizes, connections, torque, speed) {</text><text x="22" y="122" font-family="Consolas,monospace" font-size="15" fill="#777">56</text><text x="78" y="122" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve">  let ratio = 1;</text><text x="22" y="148" font-family="Consolas,monospace" font-size="15" fill="#777">57</text><text x="78" y="148" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve">  let direction = 1;</text><text x="22" y="174" font-family="Consolas,monospace" font-size="15" fill="#777">58</text><text x="78" y="174" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve">  const stages = [{ ratio: 1, torque, speed, direction }];</text><text x="22" y="200" font-family="Consolas,monospace" font-size="15" fill="#777">59</text><text x="78" y="200" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve">  for (let i = 1; i &lt; sizes.length; i++) {</text><text x="22" y="226" font-family="Consolas,monospace" font-size="15" fill="#777">60</text><text x="78" y="226" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve">    if (connections[i - 1] !== 'shaft') ratio *= sizes[i] / sizes[i - 1];</text><text x="22" y="252" font-family="Consolas,monospace" font-size="15" fill="#777">61</text><text x="78" y="252" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve">    if (connections[i - 1] === 'mesh') direction *= -1;</text><text x="22" y="278" font-family="Consolas,monospace" font-size="15" fill="#777">62</text><text x="78" y="278" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve">    stages.push({ ratio, torque: torque * ratio, speed: speed / ratio, direction });</text><text x="22" y="304" font-family="Consolas,monospace" font-size="15" fill="#777">63</text><text x="78" y="304" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve">  }</text><text x="22" y="330" font-family="Consolas,monospace" font-size="15" fill="#777">64</text><text x="78" y="330" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve">  return stages;</text><text x="22" y="356" font-family="Consolas,monospace" font-size="15" fill="#777">65</text><text x="78" y="356" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve">}</text><text x="22" y="382" font-family="Consolas,monospace" font-size="15" fill="#777">66</text><text x="78" y="382" font-family="Consolas,monospace" font-size="15" fill="#172333" xml:space="preserve"></text></svg>
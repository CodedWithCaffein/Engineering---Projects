<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1903" viewBox="0 0 1160 1903" role="img" aria-labelledby="title desc"><title id="title">EncoderMove · Blocks-style equivalent</title><desc id="desc">to runOpMode Create an ElapsedTime timer. Use the motor isBusy call, not an assumed position comparison. Do not use this as a lift controller. Resetting ticks does not physically home a mechanism. Normal-exit cleanup is shown; the Java version also uses finally for exception cleanup.</desc><rect width="1160" height="1903" rx="16" fill="#f6f8fb"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#172234">EncoderMove · Blocks-style equivalent</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#405267">Unloaded testMotor with encoder · +100 ticks · 0.20 power · 2 s timeout</text><text x="30" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#405267">ILLUSTRATION · Read the steps top to bottom; indentation shows nesting.</text><path d="M 37 130 H 52 l 6 5 h 16 l 6 -5 H 1115 Q 1122 130 1122 137 V 161 H 53 V 1662 H 1122 V 1673 Q 1122 1680 1115 1680 H 80 l -6 5 h -16 l -6 -5 H 37 Q 30 1680 30 1673 V 137 Q 30 130 37 130 Z" fill="#7440a1" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="43" y="153" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">to runOpMode</text><path d="M 65 170 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 170 1122 177 V 202 Q 1122 209 1115 209 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 209 58 202 V 177 Q 58 170 65 170 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set timer to new ElapsedTime</text><path d="M 65 214 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 214 1122 221 V 246 Q 1122 253 1115 253 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 253 58 246 V 221 Q 58 214 65 214 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.Power to 0</text><path d="M 65 258 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 258 1122 265 V 290 Q 1122 297 1115 297 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 297 58 290 V 265 Q 58 258 65 258 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="281" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.Mode to STOP_AND_RESET_ENCODER</text><path d="M 65 302 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 302 1122 309 V 334 Q 1122 341 1115 341 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 341 58 334 V 309 Q 58 302 65 302 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="325" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.Mode to RUN_WITHOUT_ENCODER</text><path d="M 65 346 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 346 1122 353 V 378 Q 1122 385 1115 385 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 385 58 378 V 353 Q 58 346 65 346 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="369" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Ready&quot;   &quot;+100 ticks, power 0.20, timeout 2 s&quot;</text><path d="M 65 390 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 390 1122 397 V 422 Q 1122 429 1115 429 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 429 58 422 V 397 Q 58 390 65 390 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 65 434 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 434 1122 441 V 466 Q 1122 473 1115 473 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 473 58 466 V 441 Q 58 434 65 434 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="457" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call waitForStart</text><path d="M 65 478 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 478 1122 485 V 509 H 81 V 1637 H 1122 V 1648 Q 1122 1655 1115 1655 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 1655 58 1648 V 485 Q 58 478 65 478 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="501" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if NOT isStopRequested</text><path d="M 93 518 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 518 1122 525 V 550 Q 1122 557 1115 557 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 557 86 550 V 525 Q 86 518 93 518 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="541" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.TargetPosition to 100</text><path d="M 93 562 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 562 1122 569 V 594 Q 1122 601 1115 601 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 601 86 594 V 569 Q 86 562 93 562 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="585" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.Mode to RUN_TO_POSITION</text><path d="M 93 606 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 606 1122 613 V 638 Q 1122 645 1115 645 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 645 86 638 V 613 Q 86 606 93 606 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="629" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call timer.reset</text><path d="M 93 650 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 650 1122 657 V 682 Q 1122 689 1115 689 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 689 86 682 V 657 Q 86 650 93 650 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="673" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.Power to 0.20</text><path d="M 93 694 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 694 1122 701 V 725 H 109 V 956 H 1122 V 967 Q 1122 974 1115 974 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 974 86 967 V 701 Q 86 694 93 694 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="717" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">repeat while opModeIsActive AND testMotor.isBusy AND timer.seconds &lt; 2</text><path d="M 121 734 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 734 1122 741 V 766 Q 1122 773 1115 773 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 773 114 766 V 741 Q 114 734 121 734 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="757" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Target (ticks)&quot;   testMotor.TargetPosition</text><path d="M 121 778 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 778 1122 785 V 810 Q 1122 817 1115 817 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 817 114 810 V 785 Q 114 778 121 778 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="801" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Position (ticks)&quot;   testMotor.CurrentPosition</text><path d="M 121 822 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 822 1122 829 V 854 Q 1122 861 1115 861 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 861 114 854 V 829 Q 114 822 121 822 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="845" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Elapsed (s)&quot;   timer.seconds</text><path d="M 121 866 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 866 1122 873 V 898 Q 1122 905 1115 905 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 905 114 898 V 873 Q 114 866 121 866 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="889" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 121 910 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 910 1122 917 V 942 Q 1122 949 1115 949 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 949 114 942 V 917 Q 114 910 121 910 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="933" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call idle</text><path d="M 93 979 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 979 1122 986 V 1010 H 109 V 1065 H 1122 V 1076 Q 1122 1083 1115 1083 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1083 86 1076 V 986 Q 86 979 93 979 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1002" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if isStopRequested</text><path d="M 121 1019 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1019 1122 1026 V 1051 Q 1122 1058 1115 1058 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 1058 114 1051 V 1026 Q 114 1019 121 1019 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="1042" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set result to &quot;Stopped&quot;</text><path d="M 93 1088 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1088 1122 1095 V 1119 H 109 V 1174 H 1122 V 1185 Q 1122 1192 1115 1192 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1192 86 1185 V 1095 Q 86 1088 93 1088 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1111" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">else if testMotor.isBusy</text><path d="M 121 1128 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1128 1122 1135 V 1160 Q 1122 1167 1115 1167 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 1167 114 1160 V 1135 Q 114 1128 121 1128 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="1151" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set result to &quot;Timeout&quot;</text><path d="M 93 1197 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1197 1122 1204 V 1228 H 109 V 1283 H 1122 V 1294 Q 1122 1301 1115 1301 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1301 86 1294 V 1204 Q 86 1197 93 1197 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1220" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">else</text><path d="M 121 1237 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1237 1122 1244 V 1269 Q 1122 1276 1115 1276 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 1276 114 1269 V 1244 Q 114 1237 121 1237 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="1260" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set result to &quot;Controller reports target reached&quot;</text><path d="M 93 1306 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1306 1122 1313 V 1338 Q 1122 1345 1115 1345 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1345 86 1338 V 1313 Q 86 1306 93 1306 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1329" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Result&quot;   result</text><path d="M 93 1350 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1350 1122 1357 V 1382 Q 1122 1389 1115 1389 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1389 86 1382 V 1357 Q 86 1350 93 1350 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1373" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Final position (ticks)&quot;   testMotor.CurrentPosition</text><path d="M 93 1394 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1394 1122 1401 V 1426 Q 1122 1433 1115 1433 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1433 86 1426 V 1401 Q 86 1394 93 1394 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1417" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 93 1438 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1438 1122 1445 V 1470 Q 1122 1477 1115 1477 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1477 86 1470 V 1445 Q 86 1438 93 1438 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1461" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.Power to 0</text><path d="M 93 1482 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1482 1122 1489 V 1514 Q 1122 1521 1115 1521 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1521 86 1514 V 1489 Q 86 1482 93 1482 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1505" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.Mode to RUN_WITHOUT_ENCODER</text><path d="M 93 1526 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1526 1122 1533 V 1557 H 109 V 1612 H 1122 V 1623 Q 1122 1630 1115 1630 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1630 86 1623 V 1533 Q 86 1526 93 1526 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1549" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">repeat while opModeIsActive</text><path d="M 121 1566 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1566 1122 1573 V 1598 Q 1122 1605 1115 1605 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 1605 114 1598 V 1573 Q 114 1566 121 1566 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="1589" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call idle</text><text x="30" y="1720" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#172234">How to read this picture</text><text x="30" y="1749" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Create an ElapsedTime timer. Use the motor isBusy call, not an assumed position comparison.</text><text x="30" y="1776" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Do not use this as a lift controller. Resetting ticks does not physically home a mechanism.</text><text x="30" y="1803" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Normal-exit cleanup is shown; the Java version also uses finally for exception cleanup.</text><text x="30" y="1881" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526278">FTC programming guides · Rebuild supported blocks in the editor · Not a robot-tested screenshot</text></svg>
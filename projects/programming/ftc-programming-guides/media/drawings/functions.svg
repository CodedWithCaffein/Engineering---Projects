<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1325" viewBox="0 0 1160 1325" role="img" aria-labelledby="title desc"><title id="title">Reusable claw actions · Blocks functions</title><desc id="desc">to openClaw; to closeClaw; inside runOpMode, after waitForStart Create two Functions blocks. This reuses behavior; it does not create a Java class in Blocks. This is a loop integration fragment. Use the setup and STOP checks from ServoToggle. Use calibrated positions and a correctly configured claw device.</desc><rect width="1160" height="1325" rx="16" fill="#f6f8fb"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#172234">Reusable claw actions · Blocks functions</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#405267">Blocks alternative to the Java Claw class · hardware: positional servo claw</text><text x="30" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#405267">ILLUSTRATION · Read the steps top to bottom; indentation shows nesting.</text><path d="M 37 130 H 52 l 6 5 h 16 l 6 -5 H 1115 Q 1122 130 1122 137 V 161 H 53 V 216 H 1122 V 227 Q 1122 234 1115 234 H 80 l -6 5 h -16 l -6 -5 H 37 Q 30 234 30 227 V 137 Q 30 130 37 130 Z" fill="#7440a1" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="43" y="153" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">to openClaw</text><path d="M 65 170 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 170 1122 177 V 202 Q 1122 209 1115 209 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 209 58 202 V 177 Q 58 170 65 170 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set claw.Position to 0.55</text><path d="M 37 258 H 52 l 6 5 h 16 l 6 -5 H 1115 Q 1122 258 1122 265 V 289 H 53 V 344 H 1122 V 355 Q 1122 362 1115 362 H 80 l -6 5 h -16 l -6 -5 H 37 Q 30 362 30 355 V 265 Q 30 258 37 258 Z" fill="#7440a1" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="43" y="281" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">to closeClaw</text><path d="M 65 298 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 298 1122 305 V 330 Q 1122 337 1115 337 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 337 58 330 V 305 Q 58 298 65 298 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="321" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set claw.Position to 0.45</text><path d="M 37 386 H 52 l 6 5 h 16 l 6 -5 H 1115 Q 1122 386 1122 393 V 417 H 53 V 1084 H 1122 V 1095 Q 1122 1102 1115 1102 H 80 l -6 5 h -16 l -6 -5 H 37 Q 30 1102 30 1095 V 393 Q 30 386 37 386 Z" fill="#7440a1" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="43" y="409" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">inside runOpMode, after waitForStart</text><path d="M 65 426 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 426 1122 433 V 458 Q 1122 465 1115 465 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 465 58 458 V 433 Q 58 426 65 426 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="449" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set open to false</text><path d="M 65 470 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 470 1122 477 V 502 Q 1122 509 1115 509 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 509 58 502 V 477 Q 58 470 65 470 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="493" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set previousA to gamepad1.A</text><path d="M 65 514 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 514 1122 521 V 545 H 81 V 1059 H 1122 V 1070 Q 1122 1077 1115 1077 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 1077 58 1070 V 521 Q 58 514 65 514 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="537" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">repeat while opModeIsActive</text><path d="M 93 554 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 554 1122 561 V 586 Q 1122 593 1115 593 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 593 86 586 V 561 Q 86 554 93 554 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="577" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set aNow to gamepad1.A</text><path d="M 93 598 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 598 1122 605 V 629 H 109 V 684 H 1122 V 695 Q 1122 702 1115 702 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 702 86 695 V 605 Q 86 598 93 598 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="621" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if aNow AND NOT previousA</text><path d="M 121 638 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 638 1122 645 V 670 Q 1122 677 1115 677 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 677 114 670 V 645 Q 114 638 121 638 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="661" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set open to NOT open</text><path d="M 93 707 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 707 1122 714 V 739 Q 1122 746 1115 746 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 746 86 739 V 714 Q 86 707 93 707 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="730" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set previousA to aNow</text><path d="M 93 751 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 751 1122 758 V 782 H 109 V 837 H 1122 V 848 Q 1122 855 1115 855 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 855 86 848 V 758 Q 86 751 93 751 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="774" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if open</text><path d="M 121 791 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 791 1122 798 V 823 Q 1122 830 1115 830 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 830 114 823 V 798 Q 114 791 121 791 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="814" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call openClaw</text><path d="M 93 860 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 860 1122 867 V 891 H 109 V 946 H 1122 V 957 Q 1122 964 1115 964 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 964 86 957 V 867 Q 86 860 93 860 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="883" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">else</text><path d="M 121 900 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 900 1122 907 V 932 Q 1122 939 1115 939 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 939 114 932 V 907 Q 114 900 121 900 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="923" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call closeClaw</text><path d="M 93 969 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 969 1122 976 V 1001 Q 1122 1008 1115 1008 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1008 86 1001 V 976 Q 86 969 93 969 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="992" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 93 1013 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1013 1122 1020 V 1045 Q 1122 1052 1115 1052 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1052 86 1045 V 1020 Q 86 1013 93 1013 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1036" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call idle</text><text x="30" y="1142" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#172234">How to read this picture</text><text x="30" y="1171" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Create two Functions blocks. This reuses behavior; it does not create a Java class in Blocks.</text><text x="30" y="1198" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">This is a loop integration fragment. Use the setup and STOP checks from ServoToggle.</text><text x="30" y="1225" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Use calibrated positions and a correctly configured claw device.</text><text x="30" y="1303" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526278">FTC programming guides · Rebuild supported blocks in the editor · Not a robot-tested screenshot</text></svg>
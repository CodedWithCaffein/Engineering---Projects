<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1329" viewBox="0 0 1160 1329" role="img" aria-labelledby="title desc"><title id="title">ImuReadout · Blocks-style equivalent</title><desc id="desc">to runOpMode Use the IMU, IMU Parameters, RevHubOrientationOnRobot, and YawPitchRollAngles drawers. UP/FORWARD is only the example mounting. Changing yaw zero is not IMU calibration.</desc><rect width="1160" height="1329" rx="16" fill="#f6f8fb"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#172234">ImuReadout · Blocks-style equivalent</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#405267">Hardware: imu · orientation must match the real hub mounting</text><text x="30" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#405267">ILLUSTRATION · Read the steps top to bottom; indentation shows nesting.</text><path d="M 37 130 H 52 l 6 5 h 16 l 6 -5 H 1115 Q 1122 130 1122 137 V 161 H 53 V 1115 H 1122 V 1126 Q 1122 1133 1115 1133 H 80 l -6 5 h -16 l -6 -5 H 37 Q 30 1133 30 1126 V 137 Q 30 130 37 130 Z" fill="#7440a1" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="43" y="153" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">to runOpMode</text><path d="M 65 170 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 170 1122 177 V 202 Q 1122 209 1115 209 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 209 58 202 V 177 Q 58 170 65 170 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set orientation to RevHubOrientationOnRobot.create(UP, FORWARD)</text><path d="M 65 214 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 214 1122 221 V 246 Q 1122 253 1115 253 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 253 58 246 V 221 Q 58 214 65 214 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set parameters to IMU.Parameters.create(orientation)</text><path d="M 65 258 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 258 1122 265 V 290 Q 1122 297 1115 297 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 297 58 290 V 265 Q 58 258 65 258 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="281" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call imu.initialize   parameters</text><path d="M 65 302 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 302 1122 309 V 334 Q 1122 341 1115 341 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 341 58 334 V 309 Q 58 302 65 302 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="325" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Ready&quot;   &quot;PLAY zeros yaw; A rezeros&quot;</text><path d="M 65 346 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 346 1122 353 V 378 Q 1122 385 1115 385 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 385 58 378 V 353 Q 58 346 65 346 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="369" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 65 390 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 390 1122 397 V 422 Q 1122 429 1115 429 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 429 58 422 V 397 Q 58 390 65 390 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call waitForStart</text><path d="M 65 434 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 434 1122 441 V 465 H 81 V 1090 H 1122 V 1101 Q 1122 1108 1115 1108 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 1108 58 1101 V 441 Q 58 434 65 434 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="457" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if NOT isStopRequested</text><path d="M 93 474 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 474 1122 481 V 506 Q 1122 513 1115 513 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 513 86 506 V 481 Q 86 474 93 474 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="497" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call imu.resetYaw</text><path d="M 93 518 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 518 1122 525 V 550 Q 1122 557 1115 557 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 557 86 550 V 525 Q 86 518 93 518 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="541" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set previousA to gamepad1.A</text><path d="M 93 562 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 562 1122 569 V 593 H 109 V 1065 H 1122 V 1076 Q 1122 1083 1115 1083 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1083 86 1076 V 569 Q 86 562 93 562 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="585" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">repeat while opModeIsActive</text><path d="M 121 602 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 602 1122 609 V 634 Q 1122 641 1115 641 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 641 114 634 V 609 Q 114 602 121 602 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="625" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set aNow to gamepad1.A</text><path d="M 121 646 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 646 1122 653 V 677 H 137 V 732 H 1122 V 743 Q 1122 750 1115 750 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 750 114 743 V 653 Q 114 646 121 646 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="669" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if aNow AND NOT previousA</text><path d="M 149 686 H 164 l 6 5 h 16 l 6 -5 H 1115 Q 1122 686 1122 693 V 718 Q 1122 725 1115 725 H 192 l -6 5 h -16 l -6 -5 H 149 Q 142 725 142 718 V 693 Q 142 686 149 686 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="155" y="709" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call imu.resetYaw</text><path d="M 121 755 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 755 1122 762 V 787 Q 1122 794 1115 794 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 794 114 787 V 762 Q 114 755 121 755 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="778" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set previousA to aNow</text><path d="M 121 799 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 799 1122 806 V 831 Q 1122 838 1115 838 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 838 114 831 V 806 Q 114 799 121 799 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="822" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set angles to call imu.getRobotYawPitchRollAngles</text><path d="M 121 843 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 843 1122 850 V 875 Q 1122 882 1115 882 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 882 114 875 V 850 Q 114 843 121 843 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="866" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set yaw to call angles.getYaw   RADIANS</text><path d="M 121 887 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 887 1122 894 V 919 Q 1122 926 1115 926 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 926 114 919 V 894 Q 114 887 121 887 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="910" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Yaw (rad)&quot;   yaw</text><path d="M 121 931 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 931 1122 938 V 963 Q 1122 970 1115 970 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 970 114 963 V 938 Q 114 931 121 931 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="954" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Yaw (deg)&quot;   yaw × 180 / PI</text><path d="M 121 975 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 975 1122 982 V 1007 Q 1122 1014 1115 1014 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 1014 114 1007 V 982 Q 114 975 121 975 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="998" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 121 1019 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1019 1122 1026 V 1051 Q 1122 1058 1115 1058 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 1058 114 1051 V 1026 Q 114 1019 121 1019 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="1042" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call idle</text><text x="30" y="1173" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#172234">How to read this picture</text><text x="30" y="1202" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Use the IMU, IMU Parameters, RevHubOrientationOnRobot, and YawPitchRollAngles drawers.</text><text x="30" y="1229" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">UP/FORWARD is only the example mounting. Changing yaw zero is not IMU calibration.</text><text x="30" y="1307" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526278">FTC programming guides · Rebuild supported blocks in the editor · Not a robot-tested screenshot</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1467" viewBox="0 0 1160 1467" role="img" aria-labelledby="title desc"><title id="title">MecanumTeleOp · Blocks-style equivalent</title><desc id="desc">to runOpMode Grouped motor statements mean repeat the matching device block for each named motor. Blocks normally uses device-specific blocks; motor is a teaching shorthand, not a device dropdown. Verify directions on your robot. The final zero shows normal-exit cleanup.</desc><rect width="1160" height="1467" rx="16" fill="#f6f8fb"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#172234">MecanumTeleOp · Blocks-style equivalent</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#405267">Four motors · robot-centric drive · speed scale 0.30</text><text x="30" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#405267">ILLUSTRATION · Read the steps top to bottom; indentation shows nesting.</text><path d="M 37 130 H 52 l 6 5 h 16 l 6 -5 H 1115 Q 1122 130 1122 137 V 161 H 53 V 1226 H 1122 V 1237 Q 1122 1244 1115 1244 H 80 l -6 5 h -16 l -6 -5 H 37 Q 30 1244 30 1237 V 137 Q 30 130 37 130 Z" fill="#7440a1" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="43" y="153" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">to runOpMode</text><path d="M 65 170 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 170 1122 177 V 202 Q 1122 209 1115 209 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 209 58 202 V 177 Q 58 170 65 170 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set frontLeft.Direction and backLeft.Direction to REVERSE</text><path d="M 65 214 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 214 1122 221 V 246 Q 1122 253 1115 253 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 253 58 246 V 221 Q 58 214 65 214 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set frontRight.Direction and backRight.Direction to FORWARD</text><path d="M 65 258 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 258 1122 265 V 289 H 81 V 432 H 1122 V 443 Q 1122 450 1115 450 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 450 58 443 V 265 Q 58 258 65 258 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="281" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">for each motor in [frontLeft, backLeft, frontRight, backRight]</text><path d="M 93 298 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 298 1122 305 V 330 Q 1122 337 1115 337 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 337 86 330 V 305 Q 86 298 93 298 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="321" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set motor.Power to 0</text><path d="M 93 342 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 342 1122 349 V 374 Q 1122 381 1115 381 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 381 86 374 V 349 Q 86 342 93 342 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="365" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set motor.Mode to RUN_WITHOUT_ENCODER</text><path d="M 93 386 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 386 1122 393 V 418 Q 1122 425 1115 425 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 425 86 418 V 393 Q 86 386 93 386 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="409" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set motor.ZeroPowerBehavior to BRAKE</text><path d="M 65 455 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 455 1122 462 V 487 Q 1122 494 1115 494 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 494 58 487 V 462 Q 58 455 65 455 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="478" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Ready&quot;   &quot;Check directions; scale 0.30&quot;</text><path d="M 65 499 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 499 1122 506 V 531 Q 1122 538 1115 538 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 538 58 531 V 506 Q 58 499 65 499 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="522" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 65 543 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 543 1122 550 V 575 Q 1122 582 1115 582 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 582 58 575 V 550 Q 58 543 65 543 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="566" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call waitForStart</text><path d="M 65 587 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 587 1122 594 V 618 H 81 V 1157 H 1122 V 1168 Q 1122 1175 1115 1175 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 1175 58 1168 V 594 Q 58 587 65 587 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="610" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">repeat while opModeIsActive</text><path d="M 93 627 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 627 1122 634 V 659 Q 1122 666 1115 666 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 666 86 659 V 634 Q 86 627 93 627 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="650" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set forward to -gamepad1.LeftStickY</text><path d="M 93 671 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 671 1122 678 V 703 Q 1122 710 1115 710 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 710 86 703 V 678 Q 86 671 93 671 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="694" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set strafe to gamepad1.LeftStickX</text><path d="M 93 715 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 715 1122 722 V 747 Q 1122 754 1115 754 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 754 86 747 V 722 Q 86 715 93 715 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="738" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set turn to gamepad1.RightStickX</text><path d="M 93 759 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 759 1122 766 V 791 Q 1122 798 1115 798 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 798 86 791 V 766 Q 86 759 93 759 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="782" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set denominator to max(1, abs(forward) + abs(strafe) + abs(turn))</text><path d="M 93 803 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 803 1122 810 V 835 Q 1122 842 1115 842 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 842 86 835 V 810 Q 86 803 93 803 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="826" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set scale to 0.30</text><path d="M 93 847 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 847 1122 854 V 879 Q 1122 886 1115 886 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 886 86 879 V 854 Q 86 847 93 847 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="870" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set frontLeft.Power to (forward + strafe + turn) / denominator × scale</text><path d="M 93 891 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 891 1122 898 V 923 Q 1122 930 1115 930 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 930 86 923 V 898 Q 86 891 93 891 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="914" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set backLeft.Power to (forward - strafe + turn) / denominator × scale</text><path d="M 93 935 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 935 1122 942 V 967 Q 1122 974 1115 974 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 974 86 967 V 942 Q 86 935 93 935 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="958" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set frontRight.Power to (forward - strafe - turn) / denominator × scale</text><path d="M 93 979 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 979 1122 986 V 1011 Q 1122 1018 1115 1018 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1018 86 1011 V 986 Q 86 979 93 979 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1002" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set backRight.Power to (forward + strafe - turn) / denominator × scale</text><path d="M 93 1023 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1023 1122 1030 V 1055 Q 1122 1062 1115 1062 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1062 86 1055 V 1030 Q 86 1023 93 1023 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1046" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Inputs&quot;   forward, strafe, turn</text><path d="M 93 1067 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1067 1122 1074 V 1099 Q 1122 1106 1115 1106 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1106 86 1099 V 1074 Q 86 1067 93 1067 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1090" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 93 1111 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1111 1122 1118 V 1143 Q 1122 1150 1115 1150 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1150 86 1143 V 1118 Q 86 1111 93 1111 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1134" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call idle</text><path d="M 65 1180 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1180 1122 1187 V 1212 Q 1122 1219 1115 1219 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 1219 58 1212 V 1187 Q 58 1180 65 1180 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="1203" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set all four drive motor powers to 0</text><text x="30" y="1284" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#172234">How to read this picture</text><text x="30" y="1313" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Grouped motor statements mean repeat the matching device block for each named motor.</text><text x="30" y="1340" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Blocks normally uses device-specific blocks; motor is a teaching shorthand, not a device dropdown.</text><text x="30" y="1367" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Verify directions on your robot. The final zero shows normal-exit cleanup.</text><text x="30" y="1445" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526278">FTC programming guides · Rebuild supported blocks in the editor · Not a robot-tested screenshot</text></svg>
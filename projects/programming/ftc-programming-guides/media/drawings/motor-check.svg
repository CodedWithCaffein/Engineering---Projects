<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1241" viewBox="0 0 1160 1241" role="img" aria-labelledby="title desc"><title id="title">MotorCheck · Blocks-style equivalent</title><desc id="desc">to runOpMode A has priority if A and B are both held. Neither held means zero power. The final zero handles normal loop exit; Java also has finally cleanup on exceptions.</desc><rect width="1160" height="1241" rx="16" fill="#f6f8fb"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#172234">MotorCheck · Blocks-style equivalent</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#405267">Hardware: testMotor · hold A / B for an unloaded motor direction test</text><text x="30" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#405267">ILLUSTRATION · Read the steps top to bottom; indentation shows nesting.</text><path d="M 37 130 H 52 l 6 5 h 16 l 6 -5 H 1115 Q 1122 130 1122 137 V 161 H 53 V 1027 H 1122 V 1038 Q 1122 1045 1115 1045 H 80 l -6 5 h -16 l -6 -5 H 37 Q 30 1045 30 1038 V 137 Q 30 130 37 130 Z" fill="#7440a1" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="43" y="153" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">to runOpMode</text><path d="M 65 170 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 170 1122 177 V 202 Q 1122 209 1115 209 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 209 58 202 V 177 Q 58 170 65 170 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.Power to 0</text><path d="M 65 214 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 214 1122 221 V 246 Q 1122 253 1115 253 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 253 58 246 V 221 Q 58 214 65 214 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.Mode to RUN_WITHOUT_ENCODER</text><path d="M 65 258 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 258 1122 265 V 290 Q 1122 297 1115 297 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 297 58 290 V 265 Q 58 258 65 258 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="281" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.ZeroPowerBehavior to BRAKE</text><path d="M 65 302 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 302 1122 309 V 334 Q 1122 341 1115 341 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 341 58 334 V 309 Q 58 302 65 302 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="325" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Ready&quot;   &quot;A: +0.15; B: -0.15&quot;</text><path d="M 65 346 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 346 1122 353 V 378 Q 1122 385 1115 385 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 385 58 378 V 353 Q 58 346 65 346 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="369" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 65 390 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 390 1122 397 V 422 Q 1122 429 1115 429 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 429 58 422 V 397 Q 58 390 65 390 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call waitForStart</text><path d="M 65 434 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 434 1122 441 V 465 H 81 V 958 H 1122 V 969 Q 1122 976 1115 976 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 976 58 969 V 441 Q 58 434 65 434 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="457" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">repeat while opModeIsActive</text><path d="M 93 474 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 474 1122 481 V 506 Q 1122 513 1115 513 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 513 86 506 V 481 Q 86 474 93 474 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="497" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set power to 0</text><path d="M 93 518 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 518 1122 525 V 549 H 109 V 604 H 1122 V 615 Q 1122 622 1115 622 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 622 86 615 V 525 Q 86 518 93 518 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="541" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if gamepad1.A</text><path d="M 121 558 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 558 1122 565 V 590 Q 1122 597 1115 597 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 597 114 590 V 565 Q 114 558 121 558 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="581" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set power to 0.15</text><path d="M 93 627 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 627 1122 634 V 658 H 109 V 713 H 1122 V 724 Q 1122 731 1115 731 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 731 86 724 V 634 Q 86 627 93 627 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="650" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">else if gamepad1.B</text><path d="M 121 667 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 667 1122 674 V 699 Q 1122 706 1115 706 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 706 114 699 V 674 Q 114 667 121 667 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="690" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set power to -0.15</text><path d="M 93 736 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 736 1122 743 V 768 Q 1122 775 1115 775 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 775 86 768 V 743 Q 86 736 93 736 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="759" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.Power to power</text><path d="M 93 780 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 780 1122 787 V 812 Q 1122 819 1115 819 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 819 86 812 V 787 Q 86 780 93 780 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="803" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Command&quot;   power</text><path d="M 93 824 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 824 1122 831 V 856 Q 1122 863 1115 863 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 863 86 856 V 831 Q 86 824 93 824 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="847" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Position (ticks)&quot;   testMotor.CurrentPosition</text><path d="M 93 868 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 868 1122 875 V 900 Q 1122 907 1115 907 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 907 86 900 V 875 Q 86 868 93 868 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="891" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 93 912 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 912 1122 919 V 944 Q 1122 951 1115 951 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 951 86 944 V 919 Q 86 912 93 912 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="935" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call idle</text><path d="M 65 981 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 981 1122 988 V 1013 Q 1122 1020 1115 1020 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 1020 58 1013 V 988 Q 58 981 65 981 Z" fill="#286c49" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="1004" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set testMotor.Power to 0</text><text x="30" y="1085" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#172234">How to read this picture</text><text x="30" y="1114" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">A has priority if A and B are both held. Neither held means zero power.</text><text x="30" y="1141" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">The final zero handles normal loop exit; Java also has finally cleanup on exceptions.</text><text x="30" y="1219" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526278">FTC programming guides · Rebuild supported blocks in the editor · Not a robot-tested screenshot</text></svg>
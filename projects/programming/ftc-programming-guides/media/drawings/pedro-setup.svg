<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="782" viewBox="0 0 1160 782" role="img" aria-labelledby="title desc"><title id="title">Pedro setup · Conceptual preparation steps</title><desc id="desc">prepare a Pedro 3 robot project Install and tune using Android Studio and Pedro's robot-hosted AutoTune interface. These are preparation steps, not blocks to drag into the FTC editor.</desc><rect width="1160" height="782" rx="16" fill="#f6f8fb"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#172234">Pedro setup · Conceptual preparation steps</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#405267">JAVA / ANDROID STUDIO WORKFLOW · not native FTC Blocks</text><text x="30" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#405267">ILLUSTRATION · Read the steps top to bottom; indentation shows nesting.</text><path d="M 37 130 H 52 l 6 5 h 16 l 6 -5 H 1115 Q 1122 130 1122 137 V 161 H 53 V 568 H 1122 V 579 Q 1122 586 1115 586 H 80 l -6 5 h -16 l -6 -5 H 37 Q 30 586 30 579 V 137 Q 30 130 37 130 Z" fill="#7440a1" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="43" y="153" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">prepare a Pedro 3 robot project</text><path d="M 65 170 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 170 1122 177 V 202 Q 1122 209 1115 209 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 209 58 202 V 177 Q 58 170 65 170 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">save existing robot code; open matching Quickstart</text><path d="M 65 214 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 214 1122 221 V 246 Q 1122 253 1115 253 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 253 58 246 V 221 Q 58 214 65 214 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">sync FTC SDK 12.0.0, Pedro revhub 3.0.2, tuning 1.0.3</text><path d="M 65 258 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 258 1122 265 V 290 Q 1122 297 1115 297 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 297 58 290 V 265 Q 58 258 65 258 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="281" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">configure real motor names and test directions</text><path d="M 65 302 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 302 1122 309 V 334 Q 1122 341 1115 341 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 341 58 334 V 309 Q 58 302 65 302 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="325" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">run mecanum tuner; apply generated configuration</text><path d="M 65 346 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 346 1122 353 V 378 Q 1122 385 1115 385 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 385 58 378 V 353 Q 58 346 65 346 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="369" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">configure actual localizer; check measured translation and heading</text><path d="M 65 390 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 390 1122 397 V 422 Q 1122 429 1115 429 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 429 58 422 V 397 Q 58 390 65 390 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">run Foresight tuning; apply generated configuration</text><path d="M 65 434 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 434 1122 441 V 466 Q 1122 473 1115 473 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 473 58 466 V 441 Q 58 434 65 434 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="457" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">replace the empty Constants.create factory</text><path d="M 65 478 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 478 1122 485 V 510 Q 1122 517 1115 517 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 517 58 510 V 485 Q 58 478 65 478 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="501" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">build and run localization / follower tests</text><path d="M 65 522 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 522 1122 529 V 554 Q 1122 561 1115 561 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 561 58 554 V 529 Q 58 522 65 522 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="545" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">then add PedroFirstPath.java</text><text x="30" y="626" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#172234">How to read this picture</text><text x="30" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Install and tune using Android Studio and Pedro's robot-hosted AutoTune interface.</text><text x="30" y="682" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">These are preparation steps, not blocks to drag into the FTC editor.</text><text x="30" y="760" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526278">FTC programming guides · Rebuild supported blocks in the editor · Not a robot-tested screenshot</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1354" viewBox="0 0 1160 1354" role="img" aria-labelledby="title desc"><title id="title">PedroFirstPath · Conceptual block logic</title><desc id="desc">concept: runOpMode Follow the Java example and Pedro setup guide. This picture explains the execution order only. Custom Java wrappers would be additional work; no Pedro Blocks wrappers are supplied here. Starting pose must match placement. Sample coordinates are not a competition route.</desc><rect width="1160" height="1354" rx="16" fill="#f6f8fb"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#172234">PedroFirstPath · Conceptual block logic</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#405267">JAVA LIBRARY · these are not built-in FTC Blocks or an importable Blocks program</text><text x="30" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#405267">ILLUSTRATION · Read the steps top to bottom; indentation shows nesting.</text><path d="M 37 130 H 52 l 6 5 h 16 l 6 -5 H 1115 Q 1122 130 1122 137 V 161 H 53 V 1113 H 1122 V 1124 Q 1122 1131 1115 1131 H 80 l -6 5 h -16 l -6 -5 H 37 Q 30 1131 30 1124 V 137 Q 30 130 37 130 Z" fill="#7440a1" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="43" y="153" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">concept: runOpMode</text><path d="M 65 170 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 170 1122 177 V 202 Q 1122 209 1115 209 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 209 58 202 V 177 Q 58 170 65 170 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">create tuned follower using Constants.create(hardwareMap)</text><path d="M 65 214 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 214 1122 221 V 245 H 81 V 300 H 1122 V 311 Q 1122 318 1115 318 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 318 58 311 V 221 Q 58 214 65 214 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if follower is null</text><path d="M 93 254 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 254 1122 261 V 286 Q 1122 293 1115 293 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 293 86 286 V 261 Q 86 254 93 254 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="277" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">show &quot;Complete Constants.create first&quot; and end this program</text><path d="M 65 323 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 323 1122 330 V 355 Q 1122 362 1115 362 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 362 58 355 V 330 Q 58 323 65 323 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="346" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">create degree-based poses: start (24,24,0), end (36,24,0)</text><path d="M 65 367 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 367 1122 374 V 399 Q 1122 406 1115 406 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 406 58 399 V 374 Q 58 367 65 367 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="390" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">build line(start, end) with linear heading interpolation</text><path d="M 65 411 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 411 1122 418 V 443 Q 1122 450 1115 450 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 450 58 443 V 418 Q 58 411 65 411 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="434" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set follower pose to start</text><path d="M 65 455 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 455 1122 462 V 487 Q 1122 494 1115 494 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 494 58 487 V 462 Q 58 455 65 455 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="478" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">show ready message; wait for PLAY</text><path d="M 65 499 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 499 1122 506 V 530 H 81 V 1088 H 1122 V 1099 Q 1122 1106 1115 1106 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 1106 58 1099 V 506 Q 58 499 65 499 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="522" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if NOT isStopRequested</text><path d="M 93 539 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 539 1122 546 V 571 Q 1122 578 1115 578 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 578 86 571 V 546 Q 86 539 93 539 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="562" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">start following the path ONCE; reset timer</text><path d="M 93 583 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 583 1122 590 V 614 H 109 V 866 H 1122 V 877 Q 1122 884 1115 884 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 884 86 877 V 590 Q 86 583 93 583 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="606" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">repeat while active</text><path d="M 121 623 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 623 1122 630 V 655 Q 1122 662 1115 662 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 662 114 655 V 630 Q 114 623 121 623 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="646" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">update follower</text><path d="M 121 667 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 667 1122 674 V 699 Q 1122 706 1115 706 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 706 114 699 V 674 Q 114 667 121 667 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="690" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">show X, Y, heading, mode, and busy state</text><path d="M 121 711 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 711 1122 718 V 742 H 137 V 797 H 1122 V 808 Q 1122 815 1115 815 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 815 114 808 V 718 Q 114 711 121 711 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="734" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if follower finished OR timer ≥ 8 s</text><path d="M 149 751 H 164 l 6 5 h 16 l 6 -5 H 1115 Q 1122 751 1122 758 V 783 Q 1122 790 1115 790 H 192 l -6 5 h -16 l -6 -5 H 149 Q 142 790 142 783 V 758 Q 142 751 149 751 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="155" y="774" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">leave this loop</text><path d="M 121 820 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 820 1122 827 V 852 Q 1122 859 1115 859 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 859 114 852 V 827 Q 114 820 121 820 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="843" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">yield to other tasks</text><path d="M 93 889 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 889 1122 896 V 921 Q 1122 928 1115 928 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 928 86 921 V 896 Q 86 889 93 889 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="912" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">show stopped / timeout / follower-complete result</text><path d="M 93 933 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 933 1122 940 V 965 Q 1122 972 1115 972 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 972 86 965 V 940 Q 86 933 93 933 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="956" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">stop follower; update once to apply IDLE motor stop</text><path d="M 93 977 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 977 1122 984 V 1008 H 109 V 1063 H 1122 V 1074 Q 1122 1081 1115 1081 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1081 86 1074 V 984 Q 86 977 93 977 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="1000" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">repeat while active</text><path d="M 121 1017 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1017 1122 1024 V 1049 Q 1122 1056 1115 1056 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 1056 114 1049 V 1024 Q 114 1017 121 1017 Z" fill="#4d6073" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="1040" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">yield to other tasks</text><text x="30" y="1171" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#172234">How to read this picture</text><text x="30" y="1200" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Follow the Java example and Pedro setup guide. This picture explains the execution order only.</text><text x="30" y="1227" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Custom Java wrappers would be additional work; no Pedro Blocks wrappers are supplied here.</text><text x="30" y="1254" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Starting pose must match placement. Sample coordinates are not a competition route.</text><text x="30" y="1332" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526278">FTC programming guides · Rebuild supported blocks in the editor · Not a robot-tested screenshot</text></svg>
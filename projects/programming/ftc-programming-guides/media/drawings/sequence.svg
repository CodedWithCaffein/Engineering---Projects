<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1392" viewBox="0 0 1160 1392" role="img" aria-labelledby="title desc"><title id="title">SequenceDemo · Blocks-style equivalent</title><desc id="desc">to runOpMode Text state values replace the Java enum; one if / else-if chain replaces switch. DONE has no action and stays displayed. Use ElapsedTime for stateTimer.</desc><rect width="1160" height="1392" rx="16" fill="#f6f8fb"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#172234">SequenceDemo · Blocks-style equivalent</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#405267">Display-only state machine · no hardware or simulated movement commands</text><text x="30" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#405267">ILLUSTRATION · Read the steps top to bottom; indentation shows nesting.</text><path d="M 37 130 H 52 l 6 5 h 16 l 6 -5 H 1115 Q 1122 130 1122 137 V 161 H 53 V 1178 H 1122 V 1189 Q 1122 1196 1115 1196 H 80 l -6 5 h -16 l -6 -5 H 37 Q 30 1196 30 1189 V 137 Q 30 130 37 130 Z" fill="#7440a1" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="43" y="153" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">to runOpMode</text><path d="M 65 170 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 170 1122 177 V 202 Q 1122 209 1115 209 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 209 58 202 V 177 Q 58 170 65 170 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set stateTimer to new ElapsedTime</text><path d="M 65 214 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 214 1122 221 V 246 Q 1122 253 1115 253 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 253 58 246 V 221 Q 58 214 65 214 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Ready&quot;   &quot;Display-only sequence&quot;</text><path d="M 65 258 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 258 1122 265 V 290 Q 1122 297 1115 297 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 297 58 290 V 265 Q 58 258 65 258 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="281" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 65 302 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 302 1122 309 V 334 Q 1122 341 1115 341 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 341 58 334 V 309 Q 58 302 65 302 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="325" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call waitForStart</text><path d="M 65 346 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 346 1122 353 V 377 H 81 V 1153 H 1122 V 1164 Q 1122 1171 1115 1171 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 1171 58 1164 V 353 Q 58 346 65 346 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="369" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if NOT isStopRequested</text><path d="M 93 386 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 386 1122 393 V 418 Q 1122 425 1115 425 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 425 86 418 V 393 Q 86 386 93 386 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="409" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set state to &quot;APPROACH&quot;</text><path d="M 93 430 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 430 1122 437 V 462 Q 1122 469 1115 469 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 469 86 462 V 437 Q 86 430 93 430 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="453" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call stateTimer.reset</text><path d="M 93 474 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 474 1122 481 V 505 H 109 V 1128 H 1122 V 1139 Q 1122 1146 1115 1146 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 1146 86 1139 V 481 Q 86 474 93 474 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="497" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">repeat while opModeIsActive</text><path d="M 121 514 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 514 1122 521 V 545 H 137 V 709 H 1122 V 720 Q 1122 727 1115 727 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 727 114 720 V 521 Q 114 514 121 514 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="537" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if state = &quot;APPROACH&quot;</text><path d="M 149 554 H 164 l 6 5 h 16 l 6 -5 H 1115 Q 1122 554 1122 561 V 585 H 165 V 684 H 1122 V 695 Q 1122 702 1115 702 H 192 l -6 5 h -16 l -6 -5 H 149 Q 142 702 142 695 V 561 Q 142 554 149 554 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="155" y="577" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if stateTimer.seconds ≥ 1.0</text><path d="M 177 594 H 192 l 6 5 h 16 l 6 -5 H 1115 Q 1122 594 1122 601 V 626 Q 1122 633 1115 633 H 220 l -6 5 h -16 l -6 -5 H 177 Q 170 633 170 626 V 601 Q 170 594 177 594 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="183" y="617" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set state to &quot;ACTUATE&quot;</text><path d="M 177 638 H 192 l 6 5 h 16 l 6 -5 H 1115 Q 1122 638 1122 645 V 670 Q 1122 677 1115 677 H 220 l -6 5 h -16 l -6 -5 H 177 Q 170 677 170 670 V 645 Q 170 638 177 638 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="183" y="661" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call stateTimer.reset</text><path d="M 121 732 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 732 1122 739 V 763 H 137 V 927 H 1122 V 938 Q 1122 945 1115 945 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 945 114 938 V 739 Q 114 732 121 732 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="755" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">else if state = &quot;ACTUATE&quot;</text><path d="M 149 772 H 164 l 6 5 h 16 l 6 -5 H 1115 Q 1122 772 1122 779 V 803 H 165 V 902 H 1122 V 913 Q 1122 920 1115 920 H 192 l -6 5 h -16 l -6 -5 H 149 Q 142 920 142 913 V 779 Q 142 772 149 772 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="155" y="795" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if stateTimer.seconds ≥ 0.5</text><path d="M 177 812 H 192 l 6 5 h 16 l 6 -5 H 1115 Q 1122 812 1122 819 V 844 Q 1122 851 1115 851 H 220 l -6 5 h -16 l -6 -5 H 177 Q 170 851 170 844 V 819 Q 170 812 177 812 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="183" y="835" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set state to &quot;DONE&quot;</text><path d="M 177 856 H 192 l 6 5 h 16 l 6 -5 H 1115 Q 1122 856 1122 863 V 888 Q 1122 895 1115 895 H 220 l -6 5 h -16 l -6 -5 H 177 Q 170 895 170 888 V 863 Q 170 856 177 856 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="183" y="879" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call stateTimer.reset</text><path d="M 121 950 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 950 1122 957 V 982 Q 1122 989 1115 989 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 989 114 982 V 957 Q 114 950 121 950 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="973" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;State&quot;   state</text><path d="M 121 994 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 994 1122 1001 V 1026 Q 1122 1033 1115 1033 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 1033 114 1026 V 1001 Q 114 994 121 994 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="1017" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;State time (s)&quot;   stateTimer.seconds</text><path d="M 121 1038 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1038 1122 1045 V 1070 Q 1122 1077 1115 1077 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 1077 114 1070 V 1045 Q 114 1038 121 1038 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="1061" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 121 1082 H 136 l 6 5 h 16 l 6 -5 H 1115 Q 1122 1082 1122 1089 V 1114 Q 1122 1121 1115 1121 H 164 l -6 5 h -16 l -6 -5 H 121 Q 114 1121 114 1114 V 1089 Q 114 1082 121 1082 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="127" y="1105" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call idle</text><text x="30" y="1236" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#172234">How to read this picture</text><text x="30" y="1265" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">Text state values replace the Java enum; one if / else-if chain replaces switch.</text><text x="30" y="1292" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#27394d">DONE has no action and stays displayed. Use ElapsedTime for stateTimer.</text><text x="30" y="1370" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#526278">FTC programming guides · Rebuild supported blocks in the editor · Not a robot-tested screenshot</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="956" viewBox="0 0 1160 956" role="img" aria-labelledby="title desc"><title id="title">TelemetryBasics · Blocks-style equivalent</title><desc id="desc">to runOpMode Create an ElapsedTime variable named timer before using its blocks. Decimal formatting and the Java-only 100 ms telemetry interval are omitted from this Blocks view.</desc><rect width="1160" height="956" rx="16" fill="#f6f8fb"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#172234">TelemetryBasics · Blocks-style equivalent</text><text x="30" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#405267">No hardware · rebuild this logic in the FTC Blocks editor</text><text x="30" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#405267">ILLUSTRATION · Read the steps top to bottom; indentation shows nesting.</text><path d="M 37 130 H 52 l 6 5 h 16 l 6 -5 H 1115 Q 1122 130 1122 137 V 161 H 53 V 742 H 1122 V 753 Q 1122 760 1115 760 H 80 l -6 5 h -16 l -6 -5 H 37 Q 30 760 30 753 V 137 Q 30 130 37 130 Z" fill="#7440a1" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="43" y="153" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">to runOpMode</text><path d="M 65 170 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 170 1122 177 V 202 Q 1122 209 1115 209 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 209 58 202 V 177 Q 58 170 65 170 Z" fill="#76501a" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="193" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">set timer to new ElapsedTime</text><path d="M 65 214 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 214 1122 221 V 246 Q 1122 253 1115 253 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 253 58 246 V 221 Q 58 214 65 214 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.addData   &quot;Status&quot;   &quot;Ready&quot;</text><path d="M 65 258 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 258 1122 265 V 290 Q 1122 297 1115 297 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 297 58 290 V 265 Q 58 258 65 258 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="281" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call telemetry.update</text><path d="M 65 302 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 302 1122 309 V 334 Q 1122 341 1115 341 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 341 58 334 V 309 Q 58 302 65 302 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="325" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call waitForStart</text><path d="M 65 346 H 80 l 6 5 h 16 l 6 -5 H 1115 Q 1122 346 1122 353 V 377 H 81 V 717 H 1122 V 728 Q 1122 735 1115 735 H 108 l -6 5 h -16 l -6 -5 H 65 Q 58 735 58 728 V 353 Q 58 346 65 346 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="71" y="369" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">if NOT isStopRequested</text><path d="M 93 386 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 386 1122 393 V 418 Q 1122 425 1115 425 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 425 86 418 V 393 Q 86 386 93 386 Z" fill="#5a438e" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="409" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">call timer.reset</text><path d="M 93 430 H 108 l 6 5 h 16 l 6 -5 H 1115 Q 1122 430 1122 437 V 461 H 109 V 692 H 1122 V 703 Q 1122 710 1115 710 H 136 l -6 5 h -16 l -6 -5 H 93 Q 86 710 86 703 V 437 Q 86 430 93 430 Z" fill="#996412" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/><text x="99" y="453" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">repeat while opModeIsActive</text><path d=